<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Snake</h1>
        <div class="scoreboard">
          <span>Score: <strong id="score">0</strong></span>
          <span>High: <strong id="high-score">0</strong></span>
        </div>
      </header>

      <section class="game">
        <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
        <div class="status">
          <p id="status-text">Press any arrow key or tap Start.</p>
          <button id="start-btn" class="primary">Start</button>
          <button id="restart-btn" class="secondary" disabled>Restart</button>
        </div>
      </section>

      <section class="controls" aria-label="On-screen controls">
        <div class="control-row">
          <button data-direction="up" aria-label="Move up">↑</button>
        </div>
        <div class="control-row">
          <button data-direction="left" aria-label="Move left">←</button>
          <button data-direction="down" aria-label="Move down">↓</button>
          <button data-direction="right" aria-label="Move right">→</button>
        </div>
      </section>

      <section class="instructions">
        <h2>How to play</h2>
        <ul>
          <li>Use arrow keys or WASD to move.</li>
          <li>Eat food to grow and increase your score.</li>
          <li>Avoid hitting walls or yourself.</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
